<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALFA FLEET - نظام سلف المندوبين</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 750px; margin: 0 auto; }
        .header { background-color: #004b93; color: white; padding: 15px 25px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header h2 { font-size: 18px; }
        .header p { font-size: 11px; opacity: 0.8; margin-top: 4px; }
        .avatar { background-color: white; color: #004b93; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #e0e0e0; color: #333; }
        .tab-btn.active { background: #0066cc; color: white; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .card-title { color: #1a252f; font-size: 20px; margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 14px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 16px; outline: none; text-align: right; }
        .btn-submit { width: 100%; padding: 14px; background-color: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-submit:hover { background-color: #218838; }
        .success-screen { text-align: center; padding: 40px 20px; display: none; }
        .success-icon { font-size: 60px; color: #28a745; margin-bottom: 15px; }
        .success-title { font-size: 22px; color: #155724; margin-bottom: 10px; font-weight: bold; }
        .success-desc { font-size: 15px; color: #555; margin-bottom: 25px; }
        .btn-reset { padding: 12px 25px; background-color: #0066cc; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 12px; white-space: nowrap; }
        th { background-color: #004b93; color: white; }
        .hidden { display: none; }
        .loading-text { text-align: center; color: #666; font-style: italic; }
        .btn-excel { background-color: #1d6f42; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            query, 
            orderBy 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA777CDe0SySpJvH_7Fx7VsU1qcbFrQPVs",
            authDomain: "alfa-fleet-bcfee.firebaseapp.com",
            projectId: "alfa-fleet-bcfee",
            storageBucket: "alfa-fleet-bcfee.firebasestorage.app",
            messagingSenderId: "631813591",
            appId: "1:631813591:web:32567bb83783ab5bd1c792",
            measurementId: "G-0C2HWMLXFF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.submitAdvanceDirect = async function() {
            const nameInput = document.getElementById('courierName');
            const branchInput = document.getElementById('branchInput');
            const govInput = document.getElementById('governorateInput');
            const transferNumInput = document.getElementById('transferNumber');
            const transferMethodInput = document.getElementById('transferMethod');
            const amountInput = document.getElementById('advanceAmount');
            const receiptInput = document.getElementById('receiptImage');

            if (!nameInput.value || !branchInput.value || !govInput.value || !transferNumInput.value || !transferMethodInput.value || !amountInput.value) {
                alert("برجاء ملء جميع الحقول المطلوبة!");
                return;
            }

            if (!receiptInput.files || receiptInput.files.length === 0) {
                alert("برجاء إرفاق صورة القبض أولاً!");
                return;
            }

            const name = nameInput.value.trim();
            const branch = branchInput.value.trim();
            const governorate = govInput.value.trim();
            const transferNumber = transferNumInput.value.trim();
            const transferMethod = transferMethodInput.value.trim();
            const amount = Number(amountInput.value);
            const file = receiptInput.files[0];
            const dateStr = new Date().toLocaleString('ar-EG');

            document.getElementById('advanceForm').reset();
            document.getElementById('advanceForm').style.display = "none";
            document.getElementById('successScreen').style.display = "block";
            document.getElementById('courierNameSuccess').innerText = name;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Image = e.target.result;
                try {
                    await addDoc(collection(db, "advances"), {
                        name: name,
                        branch: branch,
                        governorate: governorate,
                        transferNumber: transferNumber,
                        transferMethod: transferMethod,
                        amount: amount,
                        receiptImageBase64: base64Image,
                        createdAt: new Date(),
                        dateString: dateStr
                    });
                } catch (error) {
                    console.error("خطأ في حفظ البيانات:", error);
                }
            };
            reader.readAsDataURL(file);
        };

        window.resetFormView = function() {
            document.getElementById('advanceForm').reset();
            document.getElementById('successScreen').style.display = "none";
            document.getElementById('advanceForm').style.display = "block";
        };

        let fetchedRequestsData = [];
        let unsubscribeRequests = null;

        window.loadRequests = function() {
            const tableBody = document.getElementById('requestsTableBody');
            tableBody.innerHTML = '<tr><td colspan="8" class="loading-text">جاري تحميل البيانات من السيرفر...</td></tr>';

            if (unsubscribeRequests) {
                unsubscribeRequests();
                unsubscribeRequests = null;
            }

            const q = query(collection(db, "advances"), orderBy("createdAt", "desc"));

            unsubscribeRequests = onSnapshot(q, (querySnapshot) => {
                tableBody.innerHTML = '';
                fetchedRequestsData = [];

                if (querySnapshot.empty) {
                    tableBody.innerHTML = '<tr><td colspan="8">لا توجد طلبات مسجلة حتى الآن</td></tr>';
                    return;
                }

                let index = 0;
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    fetchedRequestsData.push(data);
                    const currentIndex = index++;

                    const imageBtn = data.receiptImageBase64 
                        ? `<button onclick="viewReceiptImage(${currentIndex})" style="background:#0066cc; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; font-weight:bold;">عرض الإيصال 🖼️</button>` 
                        : 'لا يوجد';

                    const row = `<tr>
                        <td>${data.name || ''}</td>
                        <td>${data.branch || ''}</td>
                        <td>${data.governorate || ''}</td>
                        <td dir="ltr">${data.transferNumber || ''}</td>
                        <td>${data.transferMethod || ''}</td>
                        <td>${data.amount || 0} ج.م</td>
                        <td>${imageBtn}</td>
                        <td>${data.dateString || ''}</td>
                    </tr>`;
                    
                    tableBody.innerHTML += row;
                });
            });
        };

        window.viewReceiptImage = function(index) {
            const item = fetchedRequestsData[index];
            if (item && item.receiptImageBase64) {
                const win = window.open();
                win.document.write(`<html dir="rtl"><head><title>إيصال التحويل</title></head><body style="text-align:center;background:#333;margin:0;padding:20px;"><img src="${item.receiptImageBase64}" style="max-width:100%;height:auto;border-radius:8px;" /></body></html>`);
            }
        };

        window.exportToExcel = function() {
            if (fetchedRequestsData.length === 0) {
                alert("لا توجد بيانات لتصديرها!");
                return;
            }

            let htmlTable = `<html dir="rtl"><head><meta charset="UTF-8"></head><body>`;
            htmlTable += `<table border="1">`;
            htmlTable += `<tr style="background:#004b93; color:white;">
                <th>اسم المندوب</th>
                <th>الفرع</th>
                <th>المحافظة</th>
                <th>رقم التحويل</th>
                <th>طريقة التحويل</th>
                <th>مبلغ السلفة</th>
                <th>صورة القبض</th>
                <th>التاريخ</th>
            </tr>`;

            fetchedRequestsData.forEach(item => {
                let receiptCell = "لا يوجد";
                if (item.receiptImageBase64) {
                    receiptCell = `<a href="${item.receiptImageBase64}">عرض الإيصال 🖼️</a>`;
                }

                htmlTable += `<tr>
                    <td>${item.name || ''}</td>
                    <td>${item.branch || ''}</td>
                    <td>${item.governorate || ''}</td>
                    <td style="mso-number-format:'\@'">${item.transferNumber || ''}</td>
                    <td>${item.transferMethod || ''}
