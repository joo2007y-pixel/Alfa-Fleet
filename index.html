<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة سلف المناديب - Alfa Fleet</title>
    <!-- استايلات وتصميم الصفحة القديم الأصلي -->
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #004b93; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #004b93; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #003366; }
        .table-responsive { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 12px; }
        th { background-color: #004b93; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>طلب سلفة لمناديب أصفا فليت</h2>
    
    <div class="form-group">
        <label for="courierName">اسم المندوب:</label>
        <input type="text" id="courierName" placeholder="أدخل اسم المندوب ثلاثي">
    </div>

    <div class="form-group">
        <label for="branchInput">الفرع:</label>
        <input type="text" id="branchInput" placeholder="أدخل اسم الفرع">
    </div>

    <div class="form-group">
        <label for="governorateInput">المحافظة:</label>
        <input type="text" id="governorateInput" placeholder="أدخل المحافظة">
    </div>

    <div class="form-group">
        <label for="transferNumber">رقم التحويل:</label>
        <input type="text" id="transferNumber" placeholder="رقم عملية التحويل">
    </div>

    <div class="form-group">
        <label for="transferMethod">طريقة التحويل:</label>
        <select id="transferMethod">
            <option value="Vodafone Cash">فودافون كاش</option>
            <option value="InstaPay">إنستاباي</option>
            <option value="Bank Transfer">تحويل بنكي</option>
        </select>
    </div>

    <div class="form-group">
        <label for="advanceAmount">مبلغ السلفة:</label>
        <input type="number" id="advanceAmount" placeholder="المبلغ بالجنيه">
    </div>

    <div class="form-group">
        <label for="receiptImage">صورة إيصال التحويل:</label>
        <input type="file" id="receiptImage" accept="image/*">
    </div>

    <button type="button" onclick="submitAdvanceDirect()">حفظ وإرسال الطلب</button>
</div>

<!-- سكريبت تشغيل فايبريس وربط البيانات مع الحماية الأمنية للجهاز -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getFirestore, 
        collection, 
        addDoc,
        getDocs,
        query,
        where 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA777CDe0SySpJvH_7Fx7VsU1qcbFrQPVs",
        authDomain: "alfa-fleet-bcfee.firebaseapp.com",
        projectId: "alfa-fleet-bcfee",
        storageBucket: "alfa-fleet-bcfee.firebasestorage.app",
        messagingSenderId: "631813591",
        appId: "1:631813591:web:32567bb83783ab5bd1c792",
        measurementId: "G-0C2HWMLXFF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // توليد أو جلب بصمة فريدة للموبايل الحالي وتخزينها محلياً
    function getDeviceFingerprint() {
        let deviceId = localStorage.getItem('alfa_device_id');
        if (!deviceId) {
            deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
            localStorage.setItem('alfa_device_id', deviceId);
        }
        return deviceId;
    }

    const currentDeviceID = getDeviceFingerprint();

    window.submitAdvanceDirect = async function() {
        const nameInput = document.getElementById('courierName');
        const branchInput = document.getElementById('branchInput');
        const govInput = document.getElementById('governorateInput');
        const transferNumInput = document.getElementById('transferNumber');
        const transferMethodInput = document.getElementById('transferMethod');
        const amountInput = document.getElementById('advanceAmount');
        const receiptInput = document.getElementById('receiptImage');

        if (!nameInput.value || !branchInput.value || !govInput.value || !transferNumInput.value || !transferMethodInput.value || !amountInput.value) {
            alert("برجاء ملء جميع الحقول المطلوبة!");
            return;
        }

        if (!receiptInput.files || receiptInput.files.length === 0) {
            alert("برجاء إرفاق صورة الإيصال أولاً!");
            return;
        }

        const name = nameInput.value.trim();
        const branch = branchInput.value.trim();
        const governorate = govInput.value.trim();
        const transferNumber = transferNumInput.value.trim();
        const transferMethod = transferMethodInput.value.trim();
        const amount = Number(amountInput.value);
        const dateStr = new Date().toLocaleString('ar-EG');
        const fileName = receiptInput.files[0].name;

        try {
            // التحقق مما إذا كان اسم المندوب مسجلاً بجهاز مختلف مسبقاً
            const q = query(collection(db, "advances"), where("name", "==", name));
            const querySnapshot = await getDocs(q);

            let registeredDevice = null;
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                if (data.deviceId) {
                    registeredDevice = data.deviceId;
                }
            });

            if (registeredDevice && registeredDevice !== currentDeviceID) {
                alert("⚠️ تنبيه أمني: هذا المندوب مسجل بالفعل على هاتف آخر! لا يمكن الإرسال من هذا الجهاز.");
                return;
            }

            // إرسال البيانات مع بصمة الجهاز الحالية
            await addDoc(collection(db, "advances"), {
                name: name,
                branch: branch,
                governorate: governorate,
                transferNumber: transferNumber,
                transferMethod: transferMethod,
                amount: amount,
                receiptImageName: fileName,
                deviceId: currentDeviceID,
                createdAt: new Date(),
                dateString: dateStr
            });
            
            alert("تم إرسال الطلب وحفظه في فايربيس بنجاح!");
            
            document.querySelector('.container').querySelectorAll('input[type="text"], input[type="number"], input[type="file"]').forEach(input => input.value = '');

        } catch (error) {
            alert("خطأ أثناء الحفظ: " + error.message);
        }
    };
</script>

</body>
</html>
